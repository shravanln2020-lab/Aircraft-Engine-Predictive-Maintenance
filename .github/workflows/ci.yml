# ─────────────────────────────────────────────────────────────────────────────
#  .github/workflows/ci.yml
#  GitHub Actions Continuous Integration for AEPM
#
#  Triggers: push / pull_request → main branch
#  Jobs:
#    1. test  — Install deps, run full 14-test suite, upload results
#    2. lint  — Flake8 code quality gate
# ─────────────────────────────────────────────────────────────────────────────

name: AEPM CI — Test Suite & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: Automated Test Suite ────────────────────────────────────────────
  test:
    name: Run AEPM Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Verify core imports
        run: |
          python -c "import streamlit, plotly, pandas, numpy, sklearn, joblib; print('All imports successful.')"

      - name: Run AEPM test suite
        run: |
          python run_tests.py

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: reports/

  # ── Job 2: Lint (Flake8) ───────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0

      - name: Run flake8 on src/ and app/
        run: |
          flake8 src/ app/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,.venv
